<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="theme-color" content="#10b981">
<title>FreshLink Distributors</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#10b981;--primary-dark:#059669;--primary-light:#d1fae5;--primary-50:#ecfdf5;
  --accent:#f59e0b;--danger:#ef4444;--danger-light:#fee2e2;
  --bg:#f8fafc;--bg-soft:#f1f5f9;--card:#ffffff;--border:#e2e8f0;--border-soft:#f1f5f9;
  --text:#0f172a;--text-soft:#334155;--muted:#64748b;--muted-soft:#94a3b8;
  --shadow-sm:0 2px 8px rgba(0,0,0,0.04);--shadow:0 4px 16px rgba(0,0,0,0.06);
  --shadow-md:0 8px 24px rgba(0,0,0,0.08);--shadow-lg:0 16px 48px rgba(0,0,0,0.12);
  --shadow-glow:0 8px 24px rgba(16,185,129,0.25);
  --r-sm:8px;--r:12px;--r-md:16px;--r-lg:20px;--r-xl:24px;--r-2xl:28px;--r-full:999px;
  --sidebar-w:260px;--transition:200ms cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"]{
  --bg:#0a0f1a;--bg-soft:#111827;--card:#1e293b;--border:#334155;--border-soft:#1e293b;
  --text:#f1f5f9;--text-soft:#cbd5e1;--muted:#94a3b8;--muted-soft:#64748b;
  --primary-light:#064e3b;--primary-50:#022c22;--danger-light:#7f1d1d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-anchor:none}
button{font-family:inherit;cursor:pointer;border:0;background:transparent}
input,select,textarea{font-family:inherit;font-size:14px}
img{max-width:100%;display:block}
.loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999}
.loader{width:56px;height:56px;position:relative}
.loader::before,.loader::after{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid transparent}
.loader::before{border-top-color:var(--primary);animation:spin 1s linear infinite}
.loader::after{border-right-color:var(--primary-light);animation:spin 1.5s linear reverse infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:20px;color:var(--muted);font-weight:600}
h1{font-size:26px;font-weight:800;line-height:1.2}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:var(--r);font-weight:700;font-size:13.5px;transition:all var(--transition);white-space:nowrap;border:1.5px solid transparent}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:var(--shadow-glow)}
.btn-success{background:#16a34a;color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-warning{background:var(--accent);color:#fff}
.btn-gray{background:var(--bg-soft);color:var(--text-soft)}
.btn-ghost{background:transparent;color:var(--text-soft);border-color:var(--border)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:var(--r-sm)}
.btn-lg{padding:14px 24px;font-size:15px}
.btn-block{width:100%;display:flex}
.card{background:var(--card);border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border-soft)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--r-full);font-size:11px;font-weight:700}
.tag-new{background:#fef3c7;color:#92400e}
.tag-accepted{background:#dbeafe;color:#1e40af}
.tag-packed{background:#e0e7ff;color:#3730a3}
.tag-dispatched{background:#fed7aa;color:#9a3412}
.tag-delivered,.tag-paid,.tag-approved,.tag-ok{background:#d1fae5;color:#065f46}
.tag-unpaid,.tag-rejected,.tag-low{background:#fee2e2;color:#991b1b}
.tag-pending{background:#fef3c7;color:#92400e}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:700;color:var(--text-soft)}
.field input,.field select,.field textarea{padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--card);color:var(--text);outline:0}
.field input:focus,.field select:focus{border-color:var(--primary)}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r-md);padding:12px 18px;box-shadow:var(--shadow-sm);border:1px solid var(--border-soft)}
.searchbar .search-icon{color:var(--muted-soft);font-size:17px}
.searchbar input{border:0;outline:0;background:transparent;width:100%;font-size:14.5px;color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--r-full);background:var(--card);color:var(--text-soft);font-weight:600;font-size:13px;white-space:nowrap;border:1.5px solid var(--border-soft)}
.chip.active{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-color:transparent}
.prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.prod-grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:900px){.prod-grid{grid-template-columns:repeat(4,1fr)}}
.prod{background:var(--card);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);border:1px solid var(--border-soft)}
.prod-img-wrap{position:relative;overflow:hidden;background:var(--bg-soft)}
.prod img{width:100%;height:110px;object-fit:cover}
.prod .noimg{width:100%;height:110px;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--muted-soft);background:var(--bg-soft)}
.prod-badges{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;z-index:2}
.prod-badge{background:var(--accent);color:#fff;padding:3px 8px;border-radius:var(--r-sm);font-size:10.5px;font-weight:800}
.prod-badge.out{background:var(--muted)}
.prod-body{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.prod-name{font-size:13.5px;font-weight:700;line-height:1.3;min-height:36px}
.prod-pack{font-size:11.5px;color:var(--muted)}
.prod-price-row{display:flex;align-items:baseline;gap:6px;margin:4px 0 8px}
.prod-price{font-size:17px;font-weight:800;color:var(--text)}
.prod-price-old{font-size:12px;color:var(--muted-soft);text-decoration:line-through;font-weight:600}
.qty-control{display:flex;align-items:center;gap:6px;margin-top:auto}
.qty-btn{flex:1;height:36px;border-radius:var(--r);background:var(--primary-light);color:var(--primary-dark);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid transparent}
.qty-add{flex:1;height:38px;border-radius:var(--r);background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:13.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.qty-count{min-width:44px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;background:var(--bg-soft);border-radius:var(--r)}
.carousel{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 16px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel-item{flex-shrink:0;width:140px;background:var(--card);border-radius:var(--r-md);padding:10px;box-shadow:var(--shadow-sm);border:1px solid var(--border-soft);text-align:center}
.carousel-item img{width:100%;height:90px;object-fit:cover;border-radius:var(--r-sm);background:var(--bg-soft)}
.carousel-item .noimg{width:100%;height:90px;border-radius:var(--r-sm);background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--muted-soft)}
.carousel-item h5{font-size:12px;font-weight:700;margin:8px 4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carousel-item .cp{font-size:14px;font-weight:800;color:var(--primary);margin-bottom:8px}
.cartbar{position:fixed;bottom:20px;left:16px;right:16px;max-width:860px;margin:0 auto;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:14px 20px;border-radius:var(--r-lg);display:flex;justify-content:space-between;align-items:center;box-shadow:0 12px 32px rgba(16,185,129,0.4);cursor:pointer;font-weight:800;z-index:30;animation:slideUp 0.3s ease}
.cartbar .cart-info{display:flex;align-items:center;gap:10px}
.cartbar .cart-count{background:rgba(255,255,255,0.25);padding:4px 10px;border-radius:var(--r-full);font-size:12px;font-weight:800}
@keyframes slideUp{from{transform:translateY(120px);opacity:0}to{transform:translateY(0);opacity:1}}
.sidebar{width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border-soft);padding:20px 14px;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:50;transition:transform var(--transition)}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:8px 10px 22px;border-bottom:1px solid var(--border-soft);margin-bottom:16px}
.sidebar-brand .icon{width:38px;height:38px;border-radius:var(--r);background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;font-size:20px}
.sidebar-brand .name{font-weight:800;font-size:14.5px}
.sidebar-brand .sub{font-size:11px;color:var(--muted);font-weight:600}
.menu{display:flex;flex-direction:column;gap:2px}
.menu-group{font-size:10.5px;font-weight:800;color:var(--muted-soft);padding:16px 12px 8px;text-transform:uppercase}
.menu a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);color:var(--text-soft);font-weight:600;font-size:13.5px;cursor:pointer}
.menu a:hover{background:var(--bg-soft);color:var(--primary)}
.menu a.active{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff}
.menu a .ic{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.menu a .badge-n{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;padding:2px 8px;border-radius:var(--r-full);font-weight:800}
.sidebar-footer{margin-top:20px;padding-top:16px;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:8px}
.main{flex:1;margin-left:var(--sidebar-w);padding:24px 28px;min-width:0;padding-bottom:100px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar h1{font-size:24px;font-weight:800}
.topbar .sub{color:var(--muted);font-size:13.5px;margin-top:4px;font-weight:500}
.topbar-actions{display:flex;gap:8px;flex-wrap:wrap}
.hamburger{display:none;background:var(--card);border:1px solid var(--border);padding:10px 12px;border-radius:var(--r);font-size:18px}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.5);backdrop-filter:blur(4px);z-index:40}
.overlay.show{display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat{border-radius:var(--r-xl);padding:20px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.stat.green{background:linear-gradient(135deg,#10b981,#059669)}
.stat.blue{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.stat.orange{background:linear-gradient(135deg,#f59e0b,#d97706)}
.stat.red{background:linear-gradient(135deg,#ef4444,#dc2626)}
.stat .lbl{font-size:12px;font-weight:700;opacity:0.9;position:relative;z-index:1}
.stat .num{font-size:30px;font-weight:900;margin-top:8px;position:relative;z-index:1}
.stat .sub{font-size:11px;opacity:0.85;margin-top:4px;font-weight:600;position:relative;z-index:1}
.stat .icon-bg{position:absolute;bottom:-10px;right:-10px;font-size:80px;opacity:0.15}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;padding:12px 14px;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:800;border-bottom:1px solid var(--border-soft);white-space:nowrap}
.tbl td{padding:14px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
.tbl tr:hover td{background:var(--bg-soft)}
.order-card{background:var(--card);border-radius:var(--r-xl);padding:20px;margin-bottom:14px;box-shadow:var(--shadow-sm);border:1px solid var(--border-soft)}
.order-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.order-id{font-weight:800;font-size:15px}
.order-shop{font-size:13px;color:var(--muted);margin-top:4px}
.order-total{font-size:20px;font-weight:900}
.order-items{background:var(--bg-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.order-item{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--border)}
.order-item:last-child{border-bottom:0}
.order-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{text-align:center;padding:60px 24px;color:var(--muted)}
.empty .ico{font-size:64px;margin-bottom:16px;opacity:0.4;display:block}
.empty h3{color:var(--text-soft);margin-bottom:8px;font-size:15px}
.empty p{font-size:13px;max-width:320px;margin:0 auto}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px;z-index:100;overflow-y:auto}
.modal.show{display:flex}
.modal-box{background:var(--card);width:100%;max-width:520px;border-radius:var(--r-2xl);padding:28px;max-height:90vh;overflow-y:auto}
.modal-box h2{font-size:20px;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1000px 500px at 0% 0%,rgba(16,185,129,0.12),transparent 50%),radial-gradient(1000px 500px at 100% 100%,rgba(5,150,105,0.12),transparent 50%),var(--bg)}
.auth-box{background:var(--card);border-radius:var(--r-2xl);padding:36px 30px;max-width:420px;width:100%;box-shadow:var(--shadow-lg);border:1px solid var(--border-soft)}
.auth-box .auth-logo{width:64px;height:64px;border-radius:var(--r-lg);background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px}
.auth-box h2{font-size:22px;text-align:center;margin-bottom:6px}
.auth-box .sub{color:var(--muted);font-size:13.5px;text-align:center;margin-bottom:24px;font-weight:500}
.auth-tabs{display:flex;background:var(--bg-soft);border-radius:var(--r-md);padding:4px;margin-bottom:22px}
.auth-tabs button{flex:1;padding:11px;border-radius:var(--r-sm);background:transparent;font-weight:700;color:var(--muted);font-size:13.5px}
.auth-tabs button.active{background:var(--card);color:var(--primary)}
.auth-link{text-align:center;margin-top:16px;font-size:13.5px}
.auth-link a{color:var(--primary);font-weight:700;cursor:pointer}
.msg{padding:12px 16px;border-radius:var(--r);font-size:13px;font-weight:600;margin-bottom:14px}
.msg-ok{background:var(--primary-light);color:var(--primary-dark)}
.msg-err{background:var(--danger-light);color:#991b1b}
.msg-info{background:#dbeafe;color:#1e40af}
.bar-row{display:flex;align-items:center;gap:12px;padding:10px 0}
.bar-label{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-value{font-size:13px;font-weight:800;color:var(--primary);white-space:nowrap}
.bar-track{flex:1.5;height:8px;background:var(--bg-soft);border-radius:var(--r-full);overflow:hidden;min-width:60px}
.bar-fill{height:100%;border-radius:var(--r-full);background:linear-gradient(90deg,var(--primary),var(--primary-dark))}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:13px 22px;border-radius:var(--r-md);font-weight:700;font-size:13.5px;z-index:9999;box-shadow:var(--shadow-lg);max-width:90vw}
.theme-toggle{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r);background:var(--bg-soft);cursor:pointer;font-size:13px;font-weight:700;color:var(--text-soft)}
.row-link{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border-soft);cursor:pointer}
.row-link:last-child{border-bottom:0}
@media(max-width:850px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:16px;padding-bottom:100px}
  .hamburger{display:inline-flex}
  .stats{grid-template-columns:repeat(2,1fr);gap:12px}
  .stat{padding:16px}
  .stat .num{font-size:24px}
  .card{padding:16px}
  .modal-box{padding:22px}
  .tbl th,.tbl td{padding:10px 8px;font-size:12.5px}
}
</style>
</head>
<body>

<div class="loading" id="loading">

  <div class="loading-text">Setting up your store...</div>
</div>

<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDocs, onSnapshot, deleteDoc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyByLW7aJZZglPBYOqNdwf6f0fH12VDElKA",
  authDomain: "fmcg-88433.firebaseapp.com",
  projectId: "fmcg-88433",
  storageBucket: "fmcg-88433.firebasestorage.app",
  messagingSenderId: "948658097398",
  appId: "1:948658097398:web:4446b52ef09d6d695470d7",
  measurementId: "G-838WYSCMML"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);

const DEFAULT_SETTINGS = {
  businessName: "FreshLink Distributors",
  tagline: "Order FMCG. Delivered to Your Shop.",
  whatsapp: "919876543210",
  callmebotKey: "",
  adminPin: "1234",
  address: "Your address",
  upi: "",
  autoApproveShops: true,
  categories: ["Biscuits","Snacks","Chocolates","Noodles","Beverages","Staples","Cooking","Personal Care"]
};

const CATEGORY_EMOJI = {
  "Biscuits":"🍪","Snacks":"🥨","Chocolates":"🍫","Noodles":"🍜",
  "Beverages":"🥤","Staples":"🌾","Cooking":"🫗","Personal Care":"🧴",
  "Confectionery":"🍬","Home Care":"🧺","Dairy":"🥛","Frozen":"🧊"
};

let DB = {
  settings: {...DEFAULT_SETTINGS},
  categories: [...DEFAULT_SETTINGS.categories],
  products: [], shops: [], orders: [], accounts: []
};

const $ = id => document.getElementById(id);
const money = n => "₹" + Number(n||0).toFixed(0);
const app = () => document.getElementById('app');

function applyTheme(){
  const theme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', theme);
}
applyTheme();
window.toggleTheme = function(){
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  if(isAdminView()) render(); else renderShop();
};

function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 2400);
}
function statusTag(s){
  const map = {'New':'tag-new','Accepted':'tag-accepted','Packed':'tag-packed','Dispatched':'tag-dispatched','Delivered':'tag-delivered'};
  return `<span class="tag ${map[s]||'tag-new'}">${s}</span>`;
}
function payTag(s){ return `<span class="tag ${s==='Paid'?'tag-paid':'tag-unpaid'}">${s||'Unpaid'}</span>`; }
function hashPwd(pwd){
  let h = 0;
  for(let i=0;i<pwd.length;i++){ h = ((h<<5)-h) + pwd.charCodeAt(i); h |= 0; }
  return "h" + Math.abs(h).toString(36) + "_" + pwd.length;
}
function initials(name){
  return (name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
}
function greeting(){
  const h = new Date().getHours();
  if(h<12) return "Good morning";
  if(h<17) return "Good afternoon";
  if(h<21) return "Good evening";
  return "Good night";
}
function timeAgo(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime())/1000;
  if(diff<60) return 'just now';
  if(diff<3600) return Math.floor(diff/60)+'m ago';
  if(diff<86400) return Math.floor(diff/3600)+'h ago';
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
}

async function loadAllData(){
  const [pSnap, sSnap, oSnap, setSnap, aSnap] = await Promise.all([
    getDocs(collection(db, "products")),
    getDocs(collection(db, "shops")),
    getDocs(collection(db, "orders")),
    getDoc(doc(db, "settings", "main")),
    getDocs(collection(db, "accounts"))
  ]);
  DB.products = pSnap.docs.map(d => ({id: d.id, ...d.data()}));
  DB.shops = sSnap.docs.map(d => ({id: d.id, ...d.data()}));
  DB.orders = oSnap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => (b.date||'').localeCompare(a.date||''));
  DB.accounts = aSnap.docs.map(d => ({id: d.id, ...d.data()}));
  if(setSnap.exists()){
    DB.settings = {...DEFAULT_SETTINGS, ...setSnap.data()};
    if(DB.settings.categories) DB.categories = DB.settings.categories;
  } else {
    await setDoc(doc(db, "settings", "main"), DEFAULT_SETTINGS);
  }
}
async function saveProductDoc(p){
  const id = p.id && !p.id.startsWith('x') ? p.id : "p" + Date.now();
  p.id = id;
  await setDoc(doc(db, "products", id), p);
  await loadAllData();
}
async function deleteProductDoc(id){ await deleteDoc(doc(db, "products", id)); await loadAllData(); }
async function saveShopDoc(s){
  const id = s.id && !s.id.startsWith('x') ? s.id : "s" + Date.now();
  s.id = id;
  await setDoc(doc(db, "shops", id), s);
  await loadAllData();
}
async function deleteShopDoc(id){ await deleteDoc(doc(db, "shops", id)); await loadAllData(); }
async function saveOrderDoc(o){
  const id = o.id || "FL" + Date.now().toString().slice(-6);
  o.id = id;
  await setDoc(doc(db, "orders", id), o);
  await loadAllData();
}
async function updateOrderDoc(id, u){ await setDoc(doc(db, "orders", id), u, {merge: true}); await loadAllData(); }
async function deleteOrderDoc(id){ await deleteDoc(doc(db, "orders", id)); await loadAllData(); }
async function saveSettingsDoc(){ await setDoc(doc(db, "settings", "main"), DB.settings); await loadAllData(); }
async function saveAccountDoc(a){
  const id = a.id && !a.id.startsWith('x') ? a.id : "a" + Date.now();
  a.id = id;
  await setDoc(doc(db, "accounts", id), a);
  await loadAllData();
  return a;
}

function startRealtime(){
  onSnapshot(collection(db, "orders"), (snap) => {
    DB.orders = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => (b.date||'').localeCompare(a.date||''));
    if(sessionStorage.getItem('dist_admin') === '1'){
      if(currentView.startsWith('orders') || currentView === 'dashboard' || currentView === 'outstanding' || currentView === 'paid'){
        renderAdmin();
      }
    }
  });
  onSnapshot(collection(db, "products"), (snap) => {
    DB.products = snap.docs.map(d => ({id: d.id, ...d.data()}));
    if(!isAdminView() && shopAccount) renderShop();
  });
  onSnapshot(collection(db, "accounts"), (snap) => {
    DB.accounts = snap.docs.map(d => ({id: d.id, ...d.data()}));
    if(isAdminView() && currentView === 'shops') renderAdmin();
  });
}

window.saveProduct = async function(id){
  const units = { Piece: +$('u_piece').value || 1 };
  const box = +$('u_box').value; if(box > 0) units.Box = box;
  const cs = +$('u_case').value; if(cs > 0) units.Case = cs;
  const ct = +$('u_carton').value; if(ct > 0) units.Carton = ct;
  const data = {
    name: $('f_name').value.trim(), sku: $('f_sku').value.trim(),
    price: +$('f_price').value, pack: $('f_pack').value.trim(),
    cat: $('f_cat').value, stock: +$('f_stock').value,
    img: $('f_img').value.trim(), units: units
  };
  if(!data.name || !data.price){ toast('⚠️ Name and price required'); return; }
  const existing = id && id !== '0' ? DB.products.find(x=>x.id===id) : null;

window.saveShopPassword = async function(mobile){
  const pwd = $('pm_pwd').value.trim(); const pwd2 = $('pm_pwd2').value.trim();
  const shop = DB.shops.find(s => s.mobile === mobile);
  if(!shop) return toast('Not found');
  if(!pwd || pwd.length < 4) return toast('⚠️ Min 4 chars');
  if(pwd !== pwd2) return toast('⚠️ Mismatch');
  const newHash = hashPwd(pwd);
  let acc = DB.accounts.find(a => a.mobile === mobile);
  if(!acc){
    acc = {mobile, name: shop.name, owner: shop.owner||'', address: shop.address||'', passwordHash: newHash, status: 'Approved', createdAt: new Date().toISOString()};
    await saveAccountDoc(acc); toast('✅ Created');
  } else {
    await saveAccountDoc({...acc, passwordHash: newHash, status: 'Approved'});
    toast('✅ Updated');
  }
  closePwdModal();
  setTimeout(() => showPwdSuccess(shop, pwd), 300);
};

window.reorderItems = function(orderId){
  const order = DB.orders.find(o => o.id === orderId);
  if(!order || !order.items?.length){ toast('Order not found'); return; }
  let added = 0;
  order.items.forEach(it => {
    let product = null;
    if(it.pid) product = DB.products.find(p => String(p.id) === String(it.pid));
    if(!product && it.name) product = DB.products.find(p => p.name === it.name);
    if(product){
      shopCart[product.id] = shopCart[product.id] || {q: 0, unit: it.unit || 'Piece'};
      if(it.unit) shopCart[product.id].unit = it.unit;
      shopCart[product.id].q += (it.qty || 1);
      added++;
    }
  });
  if(added === 0){ toast('⚠️ Products unavailable'); return; }
  localStorage.setItem('shop_cart', JSON.stringify(shopCart));
  toast(`✅ ${added} item(s) added`);
  shopTab = 'cart'; shopSubPage = null;
  setTimeout(() => renderShop(), 300);
};

function renderBuyAgain(){
  if(!DB.orders.length) return '';
  const shopOrders = DB.orders.filter(o => o.mobile === shopAccount.mobile);
  if(!shopOrders.length) return '';
  const productCount = {};
  shopOrders.forEach(o => (o.items||[]).forEach(it => { productCount[it.pid] = (productCount[it.pid]||0) + it.qty; }));
  const topIds = Object.entries(productCount).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([id])=>id);
  const topProducts = DB.products.filter(p => topIds.includes(p.id));
  if(!topProducts.length) return '';
  const shop = DB.shops.find(s=>s.mobile===shopAccount.mobile);
  return `<div style="margin-bottom:8px">
    <div style="display:flex;align-items:center;gap:8px;margin:8px 4px 4px">
      <span style="font-size:16px">⚡</span>
      <h3 style="font-size:15px;font-weight:800">Buy Again</h3>
      <span class="tag tag-delivered" style="font-size:10px">Frequently ordered</span>
    </div>
    <div class="carousel">
      ${topProducts.map(p=>{
        const price = shop?.customPrices?.[p.id] ?? p.price;
        const qty = shopCart[p.id]?.q || 0;
        const firstUnit = Object.keys(p.units || {Piece:1})[0];
        return `<div class="carousel-item">
          ${p.img ? `<img src="${p.img}" onerror="this.outerHTML='<div class=noimg>📦</div>'">` : '<div class="noimg">📦</div>'}
          <h5>${p.name}</h5>
          <div class="cp">${money(price)} <span style="font-size:10px;color:var(--muted)">/${firstUnit}</span></div>
          <div style="display:flex;align-items:center;gap:4px;justify-content:center">
            ${qty > 0
              ? `<button class="qty-btn" style="height:32px;font-size:16px;max-width:38px" onclick="shopMinus('${p.id}')">−</button>
                 <div class="qty-count" style="min-width:34px;height:32px;font-size:13px">${qty}</div>
                 <button class="qty-btn" style="height:32px;font-size:16px;max-width:38px" onclick="shopPlus('${p.id}')">+</button>`
              : `<button class="qty-add" style="height:32px;font-size:12px" onclick="shopPlus('${p.id}')">ADD +</button>`}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function shopProductCards(){
  let list = shopCat === 'All' ? DB.products : DB.products.filter(p=>p.cat===shopCat);
  const q = (window._shq||'').toLowerCase();
  if(q) list = list.filter(p => (p.name+(p.pack||'')+p.cat).toLowerCase().includes(q));
  if(!list.length) return '<div class="empty" style="grid-column:1/-1"><span class="ico">🔍</span><h3>No products found</h3></div>';
  const shop = DB.shops.find(s=>s.mobile===shopAccount.mobile);
  return list.map(p=>{
    const customPrice = shop?.customPrices?.[p.id];
    const price = customPrice ?? p.price;
    const hasDiscount = customPrice && customPrice < p.price;
    const discountPct = hasDiscount ? Math.round(((p.price - customPrice) / p.price) * 100) : 0;
    const outOfStock = (p.stock||0) <= 0;
    const qty = shopCart[p.id]?.q || 0;
    const unitList = Object.keys(p.units || {Piece:1});
    const currentUnit = shopCart[p.id]?.unit || unitList[0] || 'Piece';
    return `<div class="prod" data-id="${p.id}">
      <div class="prod-img-wrap">
        <div class="prod-badges">
          ${outOfStock ? '<span class="prod-badge out">OUT OF STOCK</span>' : ''}
          ${hasDiscount && !outOfStock ? `<span class="prod-badge">${discountPct}% OFF</span>` : ''}
        </div>
        ${p.img ? `<img src="${p.img}" onerror="this.outerHTML='<div class=noimg>📦</div>'">` : '<div class="noimg">📦</div>'}
      </div>
      <div class="prod-body">
        <div class="prod-name">${p.name}</div>
        <div class="prod-pack">${p.pack||''}</div>
        <div class="prod-price-row">
          <span class="prod-price">${money(price)}</span>
          ${hasDiscount ? `<span class="prod-price-old">${money(p.price)}</span>` : ''}
        </div>
        ${unitList.length > 1 ? `
          <div style="margin-bottom:6px">
            <select data-unit-for="${p.id}" onchange="changeCartUnit('${p.id}', this.value)" style="width:100%;padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:12px;font-weight:700;outline:0">
              ${unitList.map(u => `<option value="${u}" ${currentUnit === u ? 'selected' : ''}>${u} (${p.units[u]} pcs)</option>`).join('')}
            </select>
          </div>
        ` : ''}
        <div class="qty-control">
          ${outOfStock 
            ? '<button class="qty-add" disabled style="opacity:0.5;background:var(--muted)">Out of stock</button>'
            : (qty>0
              ? `<button class="qty-btn" onclick="shopMinus('${p.id}')">−</button><div class="qty-count">${qty}</div><button class="qty-btn" onclick="shopPlus('${p.id}')">+</button>`
              : `<button class="qty-add" onclick="shopPlus('${p.id}')">ADD +</button>`)}
        </div>
      </div>
    </div>`;
  }).join('');
}

window.shopSearch = () => { window._shq = $('shq').value; $('shgrid').innerHTML = shopProductCards(); };
window.setShopCat = (c) => { shopCat = c; renderShop(); };
window.shopPlus = (id) => {
  const p = DB.products.find(x => String(x.id) === String(id));
  if(!p) return;
  const defaultUnit = Object.keys(p.units || {Piece:1})[0];
  shopCart[id] = shopCart[id] || {q:0, unit: defaultUnit};
  if(!shopCart[id].unit) shopCart[id].unit = defaultUnit;
  shopCart[id].q++;
  localStorage.setItem('shop_cart', JSON.stringify(shopCart));
  updateSidebarCartBadge();
  if(shopTab === 'cart'){
    document.getElementById('shopContent').innerHTML = renderShopCartContent();
  } else {
    updateCardQty(id);
    shopCartBar();
  }
};
window.shopMinus = (id) => {
  if(!shopCart[id]) return;
  shopCart[id].q--;
  if(shopCart[id].q <= 0) delete shopCart[id];
  localStorage.setItem('shop_cart', JSON.stringify(shopCart));
  updateSidebarCartBadge();
  if(shopTab === 'cart'){
    document.getElementById('shopContent').innerHTML = renderShopCartContent();
  } else {
    updateCardQty(id);
    shopCartBar();
  }
};
window.changeCartUnit = (id, unit) => {
  shopCart[id] = shopCart[id] || {q:0};
  shopCart[id].unit = unit;
  localStorage.setItem('shop_cart', JSON.stringify(shopCart));
  if(shopTab === 'cart'){
    document.getElementById('shopContent').innerHTML = renderShopCartContent();
  } else {
    updateCardQty(id);
    shopCartBar();
  }
};

function updateCardQty(id){
  const p = DB.products.find(x => String(x.id) === String(id));
  if(!p) return;
  const card = document.querySelector('.prod[data-id="' + id + '"]');
  if(!card) return;
  const qty = shopCart[id]?.q || 0;
  const outOfStock = (p.stock||0) <= 0;
  const qc = card.querySelector('.qty-control');
  if(qc){
    if(outOfStock){
      qc.innerHTML = '<button class="qty-add" disabled style="opacity:0.5;background:var(--muted)">Out of stock</button>';
    } else if(qty > 0){
      qc.innerHTML = '<button class="qty-btn" onclick="shopMinus(\'' + id + '\')">−</button><div class="qty-count">' + qty + '</div><button class="qty-btn" onclick="shopPlus(\'' + id + '\')">+</button>';
    } else {
      qc.innerHTML = '<button class="qty-add" onclick="shopPlus(\'' + id + '\')">ADD +</button>';
    }
  }
  const us = card.querySelector('select[data-unit-for]');
  if(us && shopCart[id]?.unit) us.value = shopCart[id].unit;
  updateSidebarCartBadge();
}
window.setShopTab = (tab) => {
  shopTab = tab;
  shopSubPage = null;
  renderShop();
  document.querySelector('.sidebar')?.classList.remove('open');
  document.querySelector('.overlay')?.classList.remove('show');
};
window.openShopSub = function(sub){
  if(sub === 'cart'){ shopTab = 'cart'; shopSubPage = null; }
  else if(sub === 'orders'){ shopTab = 'me'; shopSubPage = 'orders'; }
  renderShop();
  document.querySelector('.sidebar')?.classList.remove('open');
  document.querySelector('.overlay')?.classList.remove('show');
};
window.closeShopSub = function(){
  shopSubPage = null;
  renderShop();
};

function shopCartItems(){
  const shop = DB.shops.find(s=>s.mobile===shopAccount.mobile);
  return Object.entries(shopCart).map(([id,e])=>{
    const p = DB.products.find(x=>x.id==id);
    if(!p || !e.q) return null;
    const unit = e.unit || 'Piece';
    const mult = (p.units && p.units[unit]) ? p.units[unit] : 1;
    const price = (shop?.customPrices?.[p.id] ?? p.price) * mult;
    return {p, q: e.q, unit, mult, price, total: e.q * price};
  }).filter(Boolean);
}
function shopCartBar(){
  const existing = document.querySelector('.cartbar');
  // Only show cart bar on the Shop tab (not Cart, not Me, not Orders)
  if(shopTab !== 'shop'){
    if(existing) existing.remove();
    return;
  }
  const items = shopCartItems();
  const total = items.reduce((s,x)=>s+x.total,0);
  const count = items.length;

  if(!items.length){
    if(existing) existing.remove();
    updateSidebarCartBadge();
    return;
  }
  if(existing){
    existing.querySelector('.cart-count').textContent = count;
    existing.querySelector('.cart-total-amount').textContent = money(total);
    updateSidebarCartBadge();
    return;
  }
  const bar = document.createElement('div');
  bar.className = 'cartbar';
  bar.onclick = () => setShopTab('cart');
  bar.innerHTML = '<div class="cart-info"><span style="font-size:20px">🛒</span><span class="cart-count">' + count + '</span><span>View Cart</span></div><div style="display:flex;align-items:center;gap:6px"><span class="cart-total-amount">' + money(total) + '</span><span style="font-size:18px">→</span></div>';
  document.body.appendChild(bar);
  updateSidebarCartBadge();
}

function updateSidebarCartBadge(){
  const cartCount = Object.keys(shopCart).length;
  const link = document.querySelector('[data-cart-link]');
  if(link){
    let badge = link.querySelector('.badge-n');
    if(cartCount > 0){
      if(!badge){ badge = document.createElement('span'); badge.className = 'badge-n'; link.appendChild(badge); }
      badge.textContent = cartCount;
    } else if(badge){ badge.remove(); }
  }
  const topCartNum = document.querySelector('.topbar-actions .cart-num');
  if(topCartNum){
    topCartNum.textContent = cartCount || '';
    topCartNum.style.display = cartCount > 0 ? 'inline-block' : 'none';
  }
}

function renderShopAuth(){
  const isLogin = authTab === 'login';
  const isForgot = authTab === 'forgot';
  const isReset = authTab === 'reset';
  app().innerHTML = `
    <div class="auth-page"><div class="auth-box">
      <div class="auth-logo">🌿</div>
      <h2>${DB.settings.businessName}</h2>
      <p class="sub">${isForgot?'Reset password':(isReset?'Verify identity':'Welcome! Login or register')}</p>
      ${(!isForgot && !isReset) ? `<div class="auth-tabs">
        <button class="${isLogin?'active':''}" onclick="setAuthTab('login')">Login</button>
        <button class="${!isLogin?'active':''}" onclick="setAuthTab('register')">Register</button>
      </div>` : ''}
      <div id="authMsg"></div>
      ${isLogin ? `
        <div class="field"><label>Mobile</label><input id="a_mobile" placeholder="10-digit" inputmode="numeric"></div>
        <div class="field"><label>Password</label><input id="a_pwd" type="password"></div>
        <button class="btn btn-primary btn-block btn-lg" onclick="shopLoginSubmit()">Login →</button>
        <div class="auth-link"><a onclick="setAuthTab('forgot')">Forgot Password?</a></div>
      ` : ''}
      ${!isLogin && !isForgot && !isReset ? `
        <div class="field"><label>Shop Name *</label><input id="r_name" placeholder="e.g. Sharma Kirana"></div>
        <div class="field"><label>Owner Name</label><input id="r_owner"></div>
        <div class="field"><label>Mobile *</label><input id="r_mobile" placeholder="10-digit" inputmode="numeric"></div>
        <div class="field"><label>Address</label><input id="r_addr"></div>
        <div class="field"><label>Password *</label><input id="r_pwd" type="password" placeholder="Min 4 chars"></div>
        <div class="field"><label>Confirm *</label><input id="r_pwd2" type="password"></div>
        <button class="btn btn-primary btn-block btn-lg" onclick="shopRegisterSubmit()">Create Account →</button>
      ` : ''}
      ${isForgot ? `
        <div class="field"><label>Registered Mobile</label><input id="fg_mobile" placeholder="10-digit" inputmode="numeric"></div>
        <button class="btn btn-primary btn-block btn-lg" onclick="forgotStep1()">Verify →</button>
        <div class="auth-link"><a onclick="setAuthTab('login')">← Back</a></div>
      ` : ''}
      ${isReset ? `
        <div class="msg msg-info"><b>✓ ${window._resetShop?.name || ''}</b></div>
        <div class="field"><label>Owner Name</label><input id="rs_owner" placeholder="Exact owner name"></div>
        <div class="field"><label>New Password</label><input id="rs_pwd" type="password" placeholder="Min 4 chars"></div>
        <div class="field"><label>Confirm</label><input id="rs_pwd2" type="password"></div>
        <button class="btn btn-primary btn-block btn-lg" onclick="forgotStep2()">Reset →</button>
        <div class="auth-link"><a onclick="setAuthTab('login')">← Back</a></div>
      ` : ''}
    </div></div>`;
}
window.setAuthTab = (t) => { authTab = t; renderShopAuth(); };
window.forgotStep1 = function(){
  const mobile = $('fg_mobile').value.trim();
  const msgBox = $('authMsg');
  const showErr = (m) => { msgBox.innerHTML = `<div class="msg msg-err">⚠️ ${m}</div>`; };
  if(!mobile) return showErr('Enter mobile');
  if(!/^\d{10}$/.test(mobile)) return showErr('Invalid mobile');
  const acc = DB.accounts.find(a => a.mobile === mobile);
  if(!acc) return showErr('Not registered');
  if(acc.status === 'Rejected') return showErr('Contact distributor');
  window._resetShop = { mobile, name: acc.name, owner: acc.owner || '', status: acc.status };
  authTab = 'reset'; renderShopAuth();
};
window.forgotStep2 = async function(){
  const ownerInput = $('rs_owner').value.trim();
  const pwd = $('rs_pwd').value; const pwd2 = $('rs_pwd2').value;
  const msgBox = $('authMsg');
  const showErr = (m) => { msgBox.innerHTML = `<div class="msg msg-err">⚠️ ${m}</div>`; };
  if(!ownerInput) return showErr('Enter owner name');
  if(!pwd || pwd.length < 4) return showErr('Min 4 chars');
  if(pwd !== pwd2) return showErr('Mismatch');
  const shop = window._resetShop;
  if(!shop){ setAuthTab('login'); return; }
  const norm = (s) => (s||'').trim().toLowerCase().replace(/\s+/g,' ');
  const matchOwner = norm(shop.owner) && norm(shop.owner) === norm(ownerInput);
  const matchName = !shop.owner && norm(shop.name) === norm(ownerInput);
  if(!matchOwner && !matchName) return showErr('Name mismatch');
  const acc = DB.accounts.find(a => a.mobile === shop.mobile);
  if(!acc) return showErr('Not found');
  await saveAccountDoc({...acc, passwordHash: hashPwd(pwd)});
  msgBox.innerHTML = `<div class="msg msg-ok">✅ Reset! Redirecting...</div>`;
  toast('✅ Password reset');
  setTimeout(() => { authTab = 'login'; window._resetShop = null; renderShopAuth(); }, 1200);
};
window.shopRegisterSubmit = async function(){
  const name = $('r_name').value.trim();
  const owner = $('r_owner').value.trim();
  const mobile = $('r_mobile').value.trim();
  const addr = $('r_addr').value.trim();
  const pwd = $('r_pwd').value; const pwd2 = $('r_pwd2').value;
  const msgBox = $('authMsg');
  const showErr = (m) => { msgBox.innerHTML = `<div class="msg msg-err">⚠️ ${m}</div>`; };
  if(!name || !mobile || !pwd) return showErr('Fill name, mobile, password');
  if(!/^\d{10}$/.test(mobile)) return showErr('Invalid mobile');
  if(pwd.length < 4) return showErr('Min 4 chars');
  if(pwd !== pwd2) return showErr('Mismatch');
  if(DB.accounts.find(a => a.mobile === mobile)) return showErr('Already registered. Please login.');
  const status = DB.settings.autoApproveShops ? 'Approved' : 'Pending';
  const account = { mobile, name, owner, address: addr, passwordHash: hashPwd(pwd), status, createdAt: new Date().toISOString() };
  await saveAccountDoc(account);
  let shop = DB.shops.find(s => s.mobile === mobile);
  if(!shop){ await saveShopDoc({name, owner, mobile, address: addr, customPrices:{}, outstanding:0}); }
  else { await saveShopDoc({...shop, name, owner, address: addr}); }
  localStorage.removeItem('shop_account');
  localStorage.removeItem('shop_cart');
  shopAccount = { name, mobile };
  localStorage.setItem('shop_account', JSON.stringify(shopAccount));
  shopCart = {}; shopTab = 'shop'; shopSubPage = null;
  toast(status === 'Approved' ? '✅ Welcome!' : '✅ Submitted');
  renderShop();
};
window.shopLoginSubmit = function(){
  const mobile = $('a_mobile').value.trim();
  const pwd = $('a_pwd').value;
  const msgBox = $('authMsg');
  const showErr = (m) => { msgBox.innerHTML = `<div class="msg msg-err">⚠️ ${m}</div>`; };
  if(!mobile || !pwd) return showErr('Enter mobile and password');
  const acc = DB.accounts.find(a => a.mobile === mobile);
  if(!acc) return showErr('Not found. Please register.');
  if(acc.passwordHash !== hashPwd(pwd)) return showErr('Wrong password');
  if(acc.status === 'Rejected') return showErr('Account rejected');
  localStorage.removeItem('shop_account');
  localStorage.removeItem('shop_cart');
  shopAccount = { name: acc.name, mobile: acc.mobile };
  localStorage.setItem('shop_account', JSON.stringify(shopAccount));
  shopCart = {}; shopTab = 'shop'; shopSubPage = null;
  toast('✅ Welcome back!');
  renderShop();
};

window.shopLogout = function(){
  localStorage.removeItem('shop_account');
  localStorage.removeItem('shop_cart');
  sessionStorage.clear();
  shopAccount = null;
  shopCart = {};
  shopTab = 'shop';
  shopSubPage = null;
  authTab = 'login';
  window._resetShop = null;
  window.location.replace(window.location.pathname + '?shop=1&t=' + Date.now());
};

window.shopPlaceOrder = async function(){
  const items = shopCartItems();
  if(!items.length){ toast('Cart empty'); return; }
  const total = items.reduce((s,x)=>s+x.total,0);
  const orderId = "FL" + Date.now().toString().slice(-6);
  const order = { id: orderId, shopName: shopAccount.name, mobile: shopAccount.mobile, date: new Date().toISOString(),
    items: items.map(x=>({pid:x.p.id, name:x.p.name, qty:x.q, unit:x.unit, mult:x.mult, price:x.price, total:x.total})), total, status: 'New', paymentStatus: 'Unpaid' };
  await saveOrderDoc(order);
  let shop = DB.shops.find(s=>s.mobile===shopAccount.mobile);
  if(shop) await saveShopDoc({...shop, outstanding: (shop.outstanding||0) + total});
  if(DB.settings.callmebotKey && DB.settings.whatsapp){
    let msg = "🌿 NEW ORDER\n\nOrder: "+orderId+"\nShop: "+shopAccount.name+"\nMobile: "+shopAccount.mobile+"\n\n";
    items.forEach(x=>{ msg += "• "+x.p.name+" ("+x.unit+") — "+x.q+" × "+money(x.price / x.mult)+" = "+money(x.total)+"\n"; });
    msg += "\nTotal: "+money(total);
    const url = "https://api.callmebot.com/whatsapp.php?phone="+DB.settings.whatsapp+"&text="+encodeURIComponent(msg)+"&apikey="+DB.settings.callmebotKey;
    fetch(url,{mode:'no-cors'}).catch(()=>{});
  }
  shopCart = {};
  localStorage.removeItem('shop_cart');
  updateSidebarCartBadge();
  document.querySelector('.cartbar')?.remove();
  toast('✅ Order placed! #'+orderId);
  shopTab = 'shop'; shopSubPage = null;
  setTimeout(()=>renderShop(), 800);
};

(async function boot(){
  const timeout = setTimeout(() => {
    $('loading').innerHTML = `<div style="text-align:center;padding:30px;max-width:400px">
      <div style="font-size:56px;margin-bottom:12px">⚠️</div>
      <h2 style="margin-bottom:10px;color:var(--text)">Connection Error</h2>
      <p style="color:var(--muted);margin-bottom:16px">Could not connect to Firebase.</p>
      <button onclick="location.reload()" class="btn btn-primary">🔄 Retry</button>
    </div>`;
  }, 15000);
  try {
    await loadAllData();
    startRealtime();
    clearTimeout(timeout);
    $('loading').style.opacity = '0';
    setTimeout(()=>{ $('loading').style.display = 'none'; }, 200);
    const params = new URLSearchParams(location.search);
    if(params.get('shop') === '1' || location.hash === '#shop'){ renderShop(); }
    else { render(); }
  } catch(err) {
    clearTimeout(timeout);
    console.error(err);
    $('loading').innerHTML = `<div style="text-align:center;padding:30px;max-width:450px">
      <div style="font-size:56px;margin-bottom:12px">❌</div>
      <h2 style="margin-bottom:10px;color:var(--text)">Setup Error</h2>
      <div style="background:#fee2e2;padding:14px;border-radius:12px;font-size:12px;color:#991b1b;text-align:left;word-break:break-word;margin:12px 0">${err.message || 'Unknown error'}</div>
      <button onclick="location.reload()" class="btn btn-primary">🔄 Retry</button>
    </div>`;
  }
})();
</script>
</body>
</html>
